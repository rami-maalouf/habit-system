# Proof on every PR.
#
# For every pull request: reuse a matching iOS simulator build or make one, start an
# EAS Simulator session with that build installed, run the e2e suite on it through
# agent-device (`eas simulator:exec` routes agent-device at the remote daemon), then
# post the run summary and the session replay link as a pull request comment.
#
# The tests live in tests/e2e/*.e2e.ts and the runner config in e2e.config.ts.
# Deterministic tests need no model; agent steps use the model in e2e.config.ts.
#
# Required EAS environment variables (production environment):
#   EXPO_TOKEN            - auths eas-cli for the simulator session (already set)
#   GITHUB_TOKEN          - fine-grained PAT with pull request write (already set)
#   E2E_ANTHROPIC_API_KEY - api key for the agent steps. Named this way on purpose:
#                           ANTHROPIC_API_KEY would also be picked up by the agent-fix
#                           workflow and bill the api instead of the subscription.

name: e2e on EAS Simulator (proof on every PR)

on:
  pull_request:
    branches: [main]
  # manual runs: `eas workflow:run .eas/workflows/e2e-pr.yml -F pr_number=2 -F grep=opens`
  # pr_number posts the comment on that pull request; grep narrows the tests by title.
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Pull request number to comment on (optional)'
        required: false
      grep:
        description: 'Only run tests whose title matches this pattern (optional)'
        required: false

jobs:
  fingerprint:
    name: Fingerprint the native runtime
    type: fingerprint
    environment: production

  get_build:
    name: Find a matching simulator build
    needs: [fingerprint]
    type: get-build
    params:
      platform: ios
      profile: sim
      simulator: true
      fingerprint_hash: ${{ needs.fingerprint.outputs.ios_fingerprint_hash }}
      wait_for_in_progress: true

  build:
    name: Build the simulator app
    needs: [get_build]
    if: ${{ !needs.get_build.outputs.build_id }}
    type: build
    environment: production
    params:
      platform: ios
      profile: sim

  e2e:
    name: Run e2e on an EAS Simulator
    after: [get_build, build]
    if: ${{ after.get_build.outputs.build_id || after.build.outputs.build_id }}
    environment: production
    env:
      BUILD_ID: ${{ after.get_build.outputs.build_id || after.build.outputs.build_id }}
      PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number || '' }}
      E2E_GREP: ${{ inputs.grep || '' }}
      REPO: rami-maalouf/habit-system
      CI: '1'
      E2E_TELEMETRY_DISABLED: '1'
    steps:
      - uses: eas/checkout
      - uses: eas/install_node_modules

      - name: Start the simulator session with the build installed
        id: session
        run: |
          printf '# managed by eas-cli\n' > .env.eas-simulator
          npx --yes eas-cli@latest simulator:start \
            --platform ios \
            --type agent-device \
            --build-id "$BUILD_ID" \
            --name "e2e PR #${PR_NUMBER:-manual}" \
            --max-duration-minutes 30 \
            --max-idle-time-minutes 10 \
            --json > .e2e-session.json
          SESSION_URL="$(node -e 'console.log(JSON.parse(require("fs").readFileSync(".e2e-session.json","utf8")).deviceRunSessionUrl ?? "")')"
          # the json carries the controller credentials; the dotenv already has them.
          rm -f .e2e-session.json
          echo "session: $SESSION_URL"
          set-output session_url "$SESSION_URL"

      - name: Run the e2e suite on the session
        id: run
        run: |
          # the mobile engine drives whatever agent-device sees; simulator:exec loads
          # AGENT_DEVICE_DAEMON_BASE_URL and AGENT_DEVICE_DAEMON_AUTH_TOKEN for it.
          if [ -n "$E2E_GREP" ]; then
            npx --yes eas-cli@latest simulator:exec bunx e2e run --reporter list,markdown,junit --grep "$E2E_GREP"
          else
            npx --yes eas-cli@latest simulator:exec bunx e2e run --reporter list,markdown,junit
          fi

      - name: Post the summary and the replay link on the pull request
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ env.GITHUB_TOKEN }}
          SESSION_URL: ${{ steps.session.outputs.session_url }}
        run: |
          if [ -z "$PR_NUMBER" ]; then
            echo "no pull request; skipping the comment"
            exit 0
          fi
          {
            if [ -f .e2e/summary.md ]; then cat .e2e/summary.md; else echo "### e2e: the run did not produce a summary"; fi
            echo
            echo "Session replay: ${SESSION_URL:-unavailable}"
          } > .e2e-comment.md
          gh pr comment "$PR_NUMBER" --repo "$REPO" --body-file .e2e-comment.md

      - name: Stop the simulator session
        if: ${{ always() }}
        run: |
          npx --yes eas-cli@latest simulator:stop --non-interactive || true
          printf '# managed by eas-cli\n' > .env.eas-simulator

      - name: Keep the run artifacts
        if: ${{ always() }}
        uses: eas/upload_artifact
        with:
          type: other
          name: e2e-artifacts
          path: .e2e
          ignore_error: true
